# H2 profili: application.properties içinde spring.profiles.active=h2 iken çalışır.
# Veriler bellekte tutulur, uygulama kapanınca silinir.
# NON_KEYWORDS=VALUE: likert_options tablosundaki "value" kolonu H2'de ayrılmış kelime olduğu için gerekli.
spring.datasource.url=jdbc:h2:mem:dfx_survey_db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
# H2 web konsolu: http://localhost:8080/h2-console
# Giriş bilgileri: JDBC URL=jdbc:h2:mem:dfx_survey_db;NON_KEYWORDS=VALUE, User Name=sa, Password=boş
