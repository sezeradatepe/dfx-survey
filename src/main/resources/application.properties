spring.application.name=dfx-survey

######## Veritabanı Seçimi ######
# Hangi veritabanının kullanılacağını aşağıdaki profil belirler:
#   spring.profiles.active=postgres -> PostgreSQL çalışır (ayarlar: application-postgres.properties, Docker gerekir)
#   spring.profiles.active=h2       -> H2 çalışır (ayarlar: application-h2.properties, kurulum gerekmez, veriler bellekte tutulur)
# Dosyayı değiştirmeden tek seferlik H2 ile çalıştırmak için:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.profiles.active=h2

# Aşağıdaki ayarlar iki veritabanı için de ortaktır
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

