######## AI Usage (Claude API) ######
# API anahtarı burada değil, ANTHROPIC_API_KEY ortam değişkeninde tutulur.
ai-usage.model=claude-haiku-5-5
# Değerlendirilecek prompt için en fazla input token (aşılırsa istek Claude'a gönderilmez)
ai-usage.max-input-tokens=4000
# Claude'un cevabı için üst sınır (düşünme token'ları dahil)
ai-usage.max-output-tokens=4000
